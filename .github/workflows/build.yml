name: Build Firmware

on:
  workflow_dispatch:

env:
  TOOLCHAIN_VERSION: "13.3.rel1"
  HOST_ARCH: "x86_64"
  TOOLCHAIN_INSTALL: "/opt/toolchains/gcc_arm/13_3-Rel1"

jobs:
  build:
    name: Build RZ/V2H Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake python3-pip python3-setuptools \
            wget xz-utils ccache

      - name: Install Python build dependencies
        run: |
          pip3 install --quiet \
            kconfiglib jinja2 jsonschema pyros-genmsg packaging \
            "empy==3.3.4"

      - name: Cache ARM GNU Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_INSTALL }}
          key: arm-gnu-toolchain-${{ env.TOOLCHAIN_VERSION }}-${{ env.HOST_ARCH }}

      - name: Install ARM GNU Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          TARBALL="arm-gnu-toolchain-${TOOLCHAIN_VERSION}-${HOST_ARCH}-arm-none-eabi.tar.xz"
          URL="https://developer.arm.com/-/media/Files/downloads/gnu/${TOOLCHAIN_VERSION}/binrel/${TARBALL}"
          wget -q "$URL" -O /tmp/toolchain.tar.xz
          sudo mkdir -p "$(dirname "${TOOLCHAIN_INSTALL}")"
          sudo tar -xf /tmp/toolchain.tar.xz -C "$(dirname "${TOOLCHAIN_INSTALL}")"
          EXTRACTED=$(tar -tJf /tmp/toolchain.tar.xz 2>/dev/null | head -1 | cut -d/ -f1)
          sudo mv "$(dirname "${TOOLCHAIN_INSTALL}")/${EXTRACTED}" "${TOOLCHAIN_INSTALL}"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      # CA55 agent build is skipped automatically when POKY_ENVIRONMENT_SETUP is unset
      - name: Build CR8 firmware
        env:
          RZV_MAVLINK_USE_OPENAMP: "OFF"
          PX4_ENABLE_STACK_MONITOR: "OFF"
          CONFIG_RZV_MEM_TELEMETRY: "OFF"
          RZV_SKIP_CA55_AGENT: "ON"
          CMAKE_BUILD_TYPE: "RelWithDebInfo"
          GNUARM_TOOLCHAIN_ROOT: "${{ env.TOOLCHAIN_INSTALL }}"
          GNUARMEMB_TOOLCHAIN_PATH: "${{ env.TOOLCHAIN_INSTALL }}"
        run: |
          export PATH="${{ env.TOOLCHAIN_INSTALL }}/bin:/usr/lib/ccache:$PATH"
          ./compile.sh build

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rzv2h-firmware-${{ github.sha }}
          path: Debug/*.elf
          retention-days: 14
